<text x="304.0" y="171.66666666666666" class="ink2" font-size="10">140/349</text>
<text x="112" y="218.33333333333331" text-anchor="end" class="ink2" font-size="11">Whoever went first</text>
<rect x="120" y="207.33333333333331" width="175.4" height="38.7" rx="3" class="s1"/>
<line x1="286.1" y1="226.7" x2="304.4" y2="226.7" class="axis" stroke-width="1.2"/>
<text x="310.4" y="218.33333333333331" class="ink" font-size="11" font-weight="bold">58.5%</text>
<text x="352.4" y="218.33333333333331" class="ink2" font-size="10">581/994</text>
<text x="24" y="258" class="ink2" font-size="10">It went first in 65% of games: it always takes first after winning the toss; opponents did 349 of 477 times.</text>
<text x="24" y="271" class="ink2" font-size="10">By coin toss, a randomized comparison: won the toss 60.2%, lost it 42.1%.</text>
