<text x="500" y="258" class="ink2" font-size="10">The hypergeometric expectation is 60.1%; games with a mulligan won 4.4 points less</text>
<text x="500" y="271" class="ink2" font-size="10">(95% CI −1.9 to +10.7); opponents mulligan in 31% of games.</text>
