<rect width="700" height="430" class="surf"/>
<text x="24" y="30" font-size="15" font-weight="bold" class="ink">Submissions do not decay &#8212; they are evicted</text>
<text x="24" y="50" font-size="11" class="ink2">Only a team's latest 2 submissions play ladder games. All 10 stopped within 0&#8211;3h BEFORE being pushed out of that window,</text>
<text x="24" y="66" font-size="11" class="ink2">even though their lifetimes span 11.9h to 62.5h. What looked like a decay curve was our own submission cadence.</text>
